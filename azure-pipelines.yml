trigger:
- main

pool:
  vmImage: windows-latest

variables:
- group: AltudeCIVault
- name: system.debug
  value: $(debug)

stages:

# ============================================================
# BUILD
# ============================================================
- stage: Build
  displayName: 'Build the web application'

  jobs:
  - job: Build
    displayName: 'Build'

    steps:

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - task: replacetokens@6
      displayName: 'Replace environment tokens'
      inputs:
        root: '$(Build.SourcesDirectory)/altude-public-website/src/environments/'
        sources: '**/*.ts'
        addBOM: true
        tokenPrefix: '#{'
        tokenSuffix: '}#'

    - task: CmdLine@2
      displayName: 'Install Angular CLI'
      inputs:
        script: 'npm install -g @angular/cli verbose'
        workingDirectory: './altude-public-website'

    - task: CmdLine@2
      displayName: 'Install npm dependencies'
      inputs:
        script: 'npm install --legacy-peer-deps'
        workingDirectory: './altude-public-website'

    - task: CmdLine@2
      displayName: 'Build the project'
      inputs:
        script: 'npm run build --prod'
        workingDirectory: './altude-public-website'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: './altude-public-website/dist'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# ============================================================
# TEST
# ============================================================
- stage: Test
  displayName: 'Deploy to test'
  dependsOn: Build
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - job: TestDeploy
    displayName: 'Test deployment'

    steps:

    - download: current
      artifact: drop

    - task: PowerShell@2
      displayName: 'Test deployment banner'
      inputs:
        targetType: 'inline'
        script: |
          $asciiArt = @"
          888888888888  88888888888  ad88888ba  888888888888     88888888ba,    88888888888  88888888ba   88           ,ad8888ba,  8b        d8
                88       88          d8"     "8b      88          88      `"8b   88           88      "8b  88          d8"'    `"8b  Y8,    ,8P
                88       88          Y8,              88          88        `8b  88           88      ,8P  88         d8'        `8b  Y8,  ,8P
                88       88aaaaa     `Y8aaaaa,        88          88         88  88aaaaa      88aaaaaa8P'  88         88          88   "8aa8"
                88       88"""""       `"""""8b,      88          88         88  88"""""      88""""""'    88         88          88    `88'
                88       88                  `8b      88          88         8P  88           88           88         Y8,        ,8P     88
                88       88          Y8a     a8P      88          88      .a8P   88           88           88          Y8a.    .a8P      88
                88       88888888888  "Y88888P"       88          88888888Y"'    88888888888  88           88888888888  `"Y8888Y"'       88
          "@

          Write-Host $asciiArt


# ============================================================
# PRODUCTION
# ============================================================
- stage: Prod
  displayName: 'Deploy to the prod environment'
  dependsOn: Build
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - job: ProductionDeploy
    displayName: 'Production deployment'

    steps:

    - download: current
      artifact: drop

    - task: PowerShell@2
      displayName: 'Production deployment banner'
      inputs:
        targetType: 'inline'
        script: |
          $asciiArt = @"
          88888888ba   88888888ba     ,ad8888ba,    88888888ba,       88888888ba,    88888888888  88888888ba   88           ,ad8888ba,  8b        d8
          88      "8b  88      "8b   d8"'    `"8b   88      `"8b      88      `"8b   88           88      "8b  88          d8"'    `"8b  Y8,    ,8P
          88      ,8P  88      ,8P  d8'        `8b  88        `8b     88        `8b  88           88      ,8P  88         d8'        `8b  Y8,  ,8P
          88aaaaaa8P'  88aaaaaa8P'  88          88  88         88     88         88  88aaaaa      88aaaaaa8P'  88         88          88   "8aa8"
          88""""""'    88""""88'    88          88  88         88     88         88  88"""""      88""""""'    88         88          88    `88'
          88           88    `8b    Y8,        ,8P  88         8P     88         8P  88           88           88         Y8,        ,8P     88
          88           88     `8b    Y8a.    .a8P   88      .a8P      88      .a8P   88           88           88          Y8a.    .a8P      88
          88           88      `8b    `"Y8888Y"'    88888888Y"'       88888888Y"'    88888888888  88           88888888888  `"Y8888Y"'       88


          88           ,ad8888ba,  888888888888  88b           d88
          88          d8"'    `"8b      88       888b         d888
          88         d8'                88       88`8b       d8'88
          88         88                 88       88 `8b     d8' 88
          88         88      88888      88       88  `8b   d8'  88
          88         Y8,        88      88       88   `8b d8'   88
          88          Y8a.    .a88      88       88    `888'    88
          88888888888  `"Y88888P"       88       88     `8'     88
          "@

          Write-Host $asciiArt

    - task: AzureCLI@2
      displayName: 'Upload files to Azure Blob Storage for website'
      inputs:

        # Azure DevOps Service Connection
        #
        # AzureCLI@2 automatically authenticates using this service
        # connection. Do NOT run "az login" again inside the script.
        azureSubscription: '7decefb2-701f-4033-a647-cc3f6a3fdf6e'

        scriptType: 'ps'
        scriptLocation: 'inlineScript'

        inlineScript: |
          $sourcePath = "$(Pipeline.Workspace)\drop\altude-public-website\browser"

          Write-Host "=========================================="
          Write-Host "Azure account"
          Write-Host "=========================================="

          az account show --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve the current Azure account."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Build output"
          Write-Host "=========================================="

          Write-Host "Source path: $sourcePath"

          if (!(Test-Path $sourcePath)) {
              Write-Host "Contents of downloaded artifact:"

              Get-ChildItem "$(Pipeline.Workspace)\drop" -Recurse |
                  Select-Object FullName

              throw "Build output not found at: $sourcePath"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Uploading website"
          Write-Host "=========================================="

          az storage blob upload-batch `
            --account-name altudepublicwebsite `
            --destination '$web' `
            --source $sourcePath `
            --auth-mode login `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob Storage upload failed."
          }

          Write-Host ""
          Write-Host "Website upload completed successfully."